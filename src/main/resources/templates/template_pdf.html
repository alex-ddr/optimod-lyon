<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; font-size: 12px; }
        .header { display: flex; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .logo { width: 100px; height: auto; }
        .title { font-size: 24px; font-weight: bold; margin-left: 20px; color: #333; }

        .step-card {
            background-color: #f4f4f4;
            border-left: 5px solid #0056b3; /* Barre bleue à gauche */
            padding: 10px;
            margin-bottom: 10px;
            page-break-inside: avoid; /* Empêche de couper une instruction en deux entre deux pages */
        }
        .step-number { font-weight: bold; color: #0056b3; }
        .footer { position: fixed; bottom: 0; width: 100%; text-align: center; font-size: 10px; color: #777; }
    </style>
</head>
<body>

<div class="header">
    <div class="title">Feuille de Route - Livraisons</div>
    <div style="margin-left: auto;">Date: <span th:text="${dateDuJour}">01/01/2024</span></div>
</div>

<h3>Détails du trajet</h3>

<div class="step-card" style="border-color: green;">
    <strong>DÉPART :</strong> <span th:text="${departDescription}">Partir de l'entrepôt...</span>
</div>

<div th:each="step, stat : ${instructions}" class="step-card">
    <span class="step-number">Étape <span th:text="${stat.count}">1</span></span> :
    <span th:text="${step}">Tourner à droite sur rue X...</span>
</div>

<div class="step-card" style="border-color: red;">
    <strong>ARRIVÉE :</strong> <span th:text="${retourDescription}">Retour à l'entrepôt...</span>
</div>

</body>
</html>
