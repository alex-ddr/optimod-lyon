name: Build Native Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest]
        include:
          - os: macos-latest
            artifact_name: optimod-lyon-macos
            asset_extension: .dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Download JavaFX jmods
        run: |
          mvn dependency:copy -Dartifact=org.openjfx:javafx-jmods:21.0.1:zip:mac -DoutputDirectory=.
          unzip -q javafx-jmods-21.0.1-mac.zip
          ls -la

      - name: Create Runtime Image (jlink)
        run: |
          jlink --module-path "javafx-jmods-21.0.1:${JAVA_HOME}/jmods" \
                --add-modules java.base,java.desktop,javafx.controls,javafx.fxml,javafx.graphics,javafx.swing,javafx.media,javafx.web \
                --output target/runtime \
                --strip-debug \
                --no-header-files \
                --no-man-pages \
                --compress=2

      - name: Create Native Package (macOS)
        run: |
          jpackage --type dmg \
                   --name OptimOdLyon \
                   --app-version 1.0.0 \
                   --vendor H31 \
                   --input target \
                   --main-jar *.jar \
                   --runtime-image target/runtime \
                   --dest target/dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/dist/*${{ matrix.asset_extension }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
